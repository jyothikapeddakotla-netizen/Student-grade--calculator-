<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Grade Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2f6;
      --panel: #ffffff;
      --ink: #14213d;
      --muted: #5b6b82;
      --line: #d5dde8;
      --accent: #2f5bea;
      --accent-soft: #e4ebff;
      --good: #187a52;
      --ok: #2f5bea;
      --warn: #b36b00;
      --bad: #bd2f2f;
      --grade: var(--muted);
      --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1624;
        --panel: #172033;
        --ink: #e9eef7;
        --muted: #9aa9c0;
        --line: #2b3a55;
        --accent: #7b9bff;
        --accent-soft: #1f2d52;
        --good: #4cc790;
        --ok: #7b9bff;
        --warn: #f0b34a;
        --bad: #ff7b7b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      line-height: 1.5;
    }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 20px 56px; }
    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      letter-spacing: -0.02em;
      margin: 0 0 4px;
    }
    .sub { color: var(--muted); margin: 0 0 28px; max-width: 56ch; }

    .layout { display: grid; gap: 20px; grid-template-columns: 1fr; align-items: start; }
    @media (min-width: 880px) { .layout { grid-template-columns: 1.45fr 1fr; } .result { position: sticky; top: 20px; } }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
    .panel h2 { font-family: var(--display); font-size: 1.15rem; margin: 0 0 14px; font-weight: 700; }

    label.field { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
    input {
      font: inherit; color: var(--ink); background: var(--bg);
      border: 1px solid var(--line); border-radius: 6px;
      padding: 8px 10px; width: 100%; min-width: 0;
    }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
    input.invalid { border-color: var(--bad); }

    .head, .row {
      display: grid; gap: 8px; align-items: center;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) 36px;
    }
    .head { font-size: .8rem; color: var(--muted); padding: 0 0 6px; }
    .row { margin-bottom: 8px; }
    .row .name { grid-column: auto; }
    .del {
      width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--line);
      background: transparent; color: var(--muted); font-size: 1.1rem; cursor: pointer;
    }
    .del:hover { color: var(--bad); border-color: var(--bad); }
    @media (max-width: 560px) {
      .head { display: none; }
      .row { grid-template-columns: 1fr 1fr 1fr 36px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
      .row .name { grid-column: 1 / -1; }
    }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button.btn {
      font: inherit; font-weight: 500; cursor: pointer;
      padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line);
      background: transparent; color: var(--ink);
    }
    button.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    @media (prefers-color-scheme: dark) { button.btn.primary { color: #0f1624; } }
    button.btn:hover { border-color: var(--accent); }

    .weight-note { font-size: .88rem; margin-top: 12px; color: var(--muted); }
    .weight-note.bad { color: var(--bad); }

    /* Result panel */
    .letter-line { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    .letter {
      font-family: var(--display); font-weight: 800; line-height: .9;
      font-size: clamp(4.5rem, 12vw, 6.5rem); color: var(--grade);
      letter-spacing: -0.04em; min-width: 1ch;
    }
    .pct { font-family: var(--display); font-size: 1.6rem; font-weight: 700; }
    .gpa { color: var(--muted); font-size: .95rem; }

    .meter { position: relative; height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; margin: 22px 0 22px; }
    .meter .fill { position: absolute; inset: 0 auto 0 0; background: var(--grade); border-radius: 99px; width: 0; transition: width .25s ease; }
    .meter .tick { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--muted); opacity: .55; }
    .meter .tick span { position: absolute; top: 16px; left: 0; transform: translateX(-50%); font-size: .72rem; color: var(--muted); }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 28px 0 4px; }
    .stat { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
    .stat b { display: block; font-family: var(--display); font-size: 1.15rem; }
    .stat span { font-size: .8rem; color: var(--muted); }

    .goal { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .goal-row { display: flex; gap: 10px; align-items: end; }
    .goal-row > div { flex: 0 0 110px; }
    .goal-msg { margin: 12px 0 0; font-size: .95rem; }
    .goal-msg.good { color: var(--good); }
    .goal-msg.bad { color: var(--bad); }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Student Grade Calculator</h1>
    <p class="sub">Add your quizzes, assignments and exams. Leave the score empty for work you haven't finished yet to see what you need on it.</p>

    <div class="layout">
      <section class="panel" aria-labelledby="work-title">
        <h2 id="work-title">Coursework</h2>

        <div class="head" aria-hidden="true">
          <span>Name</span><span>Score</span><span>Out of</span><span>Weight %</span><span></span>
        </div>
        <div id="rows"></div>

        <div class="actions">
          <button class="btn primary" id="add" type="button">Add assessment</button>
          <button class="btn" id="sample" type="button">Load sample data</button>
          <button class="btn" id="clear" type="button">Clear all</button>
        </div>
        <p class="weight-note" id="weightNote"></p>
      </section>

      <section class="panel result" aria-labelledby="result-title" aria-live="polite">
        <h2 id="result-title">Your grade</h2>

        <div class="letter-line">
          <div class="letter" id="letter">–</div>
          <div>
            <div class="pct" id="pct">–</div>
            <div class="gpa" id="gpa">Enter a score to begin</div>
          </div>
        </div>

        <div class="meter" id="meter" aria-hidden="true">
          <div class="fill" id="fill"></div>
        </div>

        <div class="stats">
          <div class="stat"><b id="gradedW">0%</b><span>of grade completed</span></div>
          <div class="stat"><b id="remainW">0%</b><span>of grade remaining</span></div>
        </div>

        <div class="goal">
          <div class="goal-row">
            <div>
              <label class="field" for="target">Target grade %</label>
              <input id="target" type="number" min="0" max="100" step="0.1" value="90">
            </div>
          </div>
          <p class="goal-msg" id="goalMsg"></p>
        </div>
      </section>
    </div>
  </main>

  <script>
    // ---------- Grade scale (4.0 GPA) ----------
    const SCALE = [
      [93, "A", 4.0], [90, "A-", 3.7],
      [87, "B+", 3.3], [83, "B", 3.0], [80, "B-", 2.7],
      [77, "C+", 2.3], [73, "C", 2.0], [70, "C-", 1.7],
      [67, "D+", 1.3], [63, "D", 1.0], [60, "D-", 0.7],
      [0, "F", 0.0]
    ];
    const gradeFor = (p) => SCALE.find((s) => p + 1e-9 >= s[0]);

    // ---------- State ----------
    const STORE_KEY = "gradecalc.v1";
    let nextId = 1;
    let rows = [];
    let target = 90;

    const SAMPLE = [
      { name: "Quiz 1", score: "18", max: "20", weight: "10" },
      { name: "Assignment 1", score: "45", max: "50", weight: "15" },
      { name: "Midterm", score: "78", max: "100", weight: "25" },
      { name: "Assignment 2", score: "", max: "50", weight: "15" },
      { name: "Final exam", score: "", max: "100", weight: "35" }
    ];

    function save() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify({ rows, target })); } catch (e) { /* storage unavailable */ }
    }
    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(STORE_KEY));
        if (data && Array.isArray(data.rows)) { rows = data.rows; target = data.target ?? 90; return true; }
      } catch (e) { /* ignore */ }
      return false;
    }
    function setRows(list) {
      rows = list.map((r) => ({ id: nextId++, ...r }));
    }

    // ---------- Calculation ----------
    const num = (v) => (v === "" || v === null || v === undefined ? NaN : Number(v));

    function compute() {
      let totalW = 0, gradedW = 0, earned = 0;
      for (const r of rows) {
        const w = num(r.weight), max = num(r.max), score = num(r.score);
        if (!(w > 0)) continue;
        totalW += w;
        if (max > 0 && score >= 0 && !Number.isNaN(score)) {
          gradedW += w;
          earned += (score / max) * w;
        }
      }
      const remainingW = totalW - gradedW;
      return {
        totalW, gradedW, remainingW, earned,
        current: gradedW > 0 ? (earned / gradedW) * 100 : null
      };
    }

    // ---------- Rendering ----------
    const $ = (id) => document.getElementById(id);

    function renderRows() {
      const box = $("rows");
      box.innerHTML = "";
      rows.forEach((r) => {
        const row = document.createElement("div");
        row.className = "row";
        row.append(
          makeInput(r, "name", "text", "Assessment name", "name"),
          makeInput(r, "score", "number", "Score", ""),
          makeInput(r, "max", "number", "Out of", ""),
          makeInput(r, "weight", "number", "Weight percent", "")
        );
        const del = document.createElement("button");
        del.type = "button";
        del.className = "del";
        del.textContent = "×";
        del.setAttribute("aria-label", "Remove " + (r.name || "assessment"));
        del.addEventListener("click", () => {
          rows = rows.filter((x) => x.id !== r.id);
          renderRows(); update();
        });
        row.append(del);
        box.append(row);
      });
    }

    function makeInput(r, key, type, label, cls) {
      const el = document.createElement("input");
      el.type = type;
      el.value = r[key];
      el.setAttribute("aria-label", label);
      if (cls) el.className = cls;
      if (type === "number") { el.min = "0"; el.step = "any"; el.inputMode = "decimal"; }
      if (key === "name") el.placeholder = "e.g. Quiz 2";
      if (key === "score") el.placeholder = "not graded";
      el.addEventListener("input", () => {
        r[key] = el.value;
        update();
      });
      return el;
    }

    function update() {
      const c = compute();
      const letterEl = $("letter");

      // Weight note
      const wn = $("weightNote");
      const total = Math.round(c.totalW * 100) / 100;
      if (rows.length === 0) {
        wn.textContent = "No assessments yet. Add one to start.";
        wn.className = "weight-note";
      } else if (total !== 100) {
        wn.textContent = "Weights add up to " + total + "%, not 100%. Results are scaled to your total.";
        wn.className = "weight-note bad";
      } else {
        wn.textContent = "Weights add up to 100%.";
        wn.className = "weight-note";
      }

      // Main result
      if (c.current === null) {
        letterEl.textContent = "–";
        document.documentElement.style.setProperty("--grade", "var(--muted)");
        $("pct").textContent = "–";
        $("gpa").textContent = "Enter a score to begin";
        $("fill").style.width = "0%";
      } else {
        const g = gradeFor(c.current);
        letterEl.textContent = g[1];
        $("pct").textContent = c.current.toFixed(2) + "%";
        $("gpa").textContent = "GPA " + g[2].toFixed(1) + " on the 4.0 scale";
        $("fill").style.width = Math.min(100, Math.max(0, c.current)) + "%";
        const colour = c.current >= 80 ? "var(--good)" : c.current >= 70 ? "var(--ok)" : c.current >= 60 ? "var(--warn)" : "var(--bad)";
        document.documentElement.style.setProperty("--grade", colour);
      }

      // Progress stats
      const share = (w) => (c.totalW > 0 ? ((w / c.totalW) * 100).toFixed(1).replace(/\.0$/, "") : "0") + "%";
      $("gradedW").textContent = share(c.gradedW);
      $("remainW").textContent = share(c.remainingW);

      // Goal planner
      const msg = $("goalMsg");
      const t = parseFloat($("target").value);
      target = Number.isNaN(t) ? target : t;
      if (c.totalW === 0 || Number.isNaN(t)) {
        msg.textContent = "";
        msg.className = "goal-msg";
      } else if (c.remainingW <= 0) {
        msg.textContent = "All work is graded. Your final grade is " + (c.earned / c.totalW * 100).toFixed(2) + "%.";
        msg.className = "goal-msg " + ((c.earned / c.totalW * 100) >= t ? "good" : "bad");
      } else {
        const secured = (c.earned / c.totalW) * 100;
        const best = ((c.earned + c.remainingW) / c.totalW) * 100;
        const needed = ((t * c.totalW) / 100 - c.earned) / c.remainingW * 100;
        const rem = share(c.remainingW);
        if (needed <= 0) {
          msg.textContent = "You've already secured " + t + "%, even with 0 on the remaining work.";
          msg.className = "goal-msg good";
        } else if (needed > 100) {
          msg.textContent = "Not reachable. Even with full marks on the remaining " + rem + ", your highest possible grade is " + best.toFixed(2) + "%.";
          msg.className = "goal-msg bad";
        } else {
          msg.textContent = "To finish with " + t + "%, you need an average of " + needed.toFixed(1) + "% on the remaining " + rem + " of the grade.";
          msg.className = "goal-msg";
        }
      }
      save();
    }

    function buildMeter() {
      const m = $("meter");
      [60, 70, 80, 90].forEach((p) => {
        const tick = document.createElement("div");
        tick.className = "tick";
        tick.style.left = p + "%";
        const s = document.createElement("span");
        s.textContent = p;
        tick.append(s);
        m.append(tick);
      });
    }

    // ---------- Events ----------
    $("add").addEventListener("click", () => {
      rows.push({ id: nextId++, name: "", score: "", max: "100", weight: "" });
      renderRows(); update();
      const inputs = $("rows").querySelectorAll(".name");
      inputs[inputs.length - 1].focus();
    });
    $("sample").addEventListener("click", () => { setRows(SAMPLE); renderRows(); update(); });
    $("clear").addEventListener("click", () => { rows = []; renderRows(); update(); });
    $("target").addEventListener("input", update);

    // ---------- Start ----------
    buildMeter();
    if (load()) {
      rows.forEach((r) => { r.id = nextId++; });
    } else {
      setRows(SAMPLE);
    }
    $("target").value = target;
    renderRows();
    update();
  </script>
</body>
</html>
